name: SQL Server CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Deploy SQL Database
    runs-on: [self-hosted, Windows, X64]

    steps:

      # ======================================================
      # 1. Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Setup MSBuild
      # ======================================================

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2


      # ======================================================
      # 3. Verify SQL Database Project
      # ======================================================

      - name: Verify SQL Project
        shell: powershell
        run: |
          $project = "database/project/HealthcareCICD.Database/HealthcareCICD.Database.sqlproj"

          if (-not (Test-Path $project)) {
              Write-Error "SQL Database Project not found: $project"
              exit 1
          }

          Write-Host "SQL project found:"
          Write-Host $project


      # ======================================================
      # 4. Verify SqlPackage
      # ======================================================

      - name: Verify SqlPackage
        shell: powershell
        run: |
          sqlpackage /Version

          if ($LASTEXITCODE -ne 0) {
              Write-Error "SqlPackage is not available."
              exit 1
          }

          Write-Host "SqlPackage is available."


      # ======================================================
      # 5. Build SQL Database Project
      # ======================================================

      - name: Build SQL Database Project
        shell: powershell
        run: |
          msbuild `
            "database/project/HealthcareCICD.Database/HealthcareCICD.Database.sqlproj" `
            /p:Configuration=Debug `
            /p:Platform="Any CPU"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "SQL Database Project build failed."
              exit 1
          }

          Write-Host "SQL Database Project build succeeded."


      # ======================================================
      # 6. Verify DACPAC
      # ======================================================
      - name: Verify DACPAC
        shell: powershell
        run: |
          $expected = "database/project/HealthcareCICD.Database/bin/Debug/HealthcareCICD.Database.dacpac"

          Write-Host "Expected DACPAC path:"
          Write-Host $expected

          Write-Host ""
          Write-Host "Searching for DACPAC files..."

          $dacpacs = Get-ChildItem `
            -Path "database/project" `
            -Filter "*.dacpac" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($dacpacs.Count -eq 0) {
              Write-Error "No DACPAC file was found under database/project."
              exit 1
          }

          Write-Host ""
          Write-Host "DACPAC files found:"

          foreach ($file in $dacpacs) {
              Write-Host " - $($file.FullName)"
              Write-Host "   Size: $($file.Length) bytes"
          }

          if (-not (Test-Path $expected)) {
              Write-Error "Expected DACPAC was not found: $expected"
              exit 1
          }

          Write-Host ""
          Write-Host "Expected DACPAC found successfully."
      # ======================================================
      # Temporary SQL Connection Test
      # ======================================================

      - name: Test SQL connection
        shell: powershell
        env:
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          Write-Host "Testing SQL connection..."

          sqlcmd `
            -S "${{ secrets.SQL_SERVER }}" `
            -d "${{ secrets.SQL_DATABASE }}" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -b `
            -Q "SELECT @@SERVERNAME AS ServerName, DB_NAME() AS DatabaseName, SUSER_SNAME() AS LoginName;"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "SQL connection test failed."
              exit 1
          }

          Write-Host "SQL connection test succeeded."

      # ======================================================
      # 7. Detect Schema Drift
      #
      # Exit codes from detect-schema-drift.ps1:
      #
      #   0  = No drift
      #   10 = Drift detected
      #   1  = Technical error
      # ======================================================

      - name: Detect schema drift
        id: drift
        continue-on-error: true
        shell: powershell
        env:
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          .\scripts\detect-schema-drift.ps1 `
            -Server "${{ secrets.SQL_SERVER }}" `
            -Database "${{ secrets.SQL_DATABASE }}"

          $exitCode = $LASTEXITCODE

          Write-Host "Schema drift script exit code: $exitCode"

          if ($exitCode -eq 0) {
              "status=CLEAN" >> $env:GITHUB_OUTPUT
              exit 0
          }

          if ($exitCode -eq 10) {
              "status=DRIFT" >> $env:GITHUB_OUTPUT
              exit 0
          }

          "status=ERROR" >> $env:GITHUB_OUTPUT
          exit 0


      # ======================================================
      # 8. Log Schema Drift
      # ======================================================

      - name: Log schema drift
        if: steps.drift.outputs.status == 'DRIFT'
        continue-on-error: true
        shell: powershell
        env:
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $commitSha = "${{ github.sha }}"
          $environment = "Development"

          $query = @"
          INSERT INTO dbo.DeploymentLog
          (
              DeploymentDate,
              CommitSha,
              Environment,
              Status,
              ExecutedBy,
              ErrorMessage
          )
          VALUES
          (
              SYSUTCDATETIME(),
              '$commitSha',
              '$environment',
              'DRIFT_DETECTED',
              SUSER_SNAME(),
              'Schema drift detected. Deployment was blocked before DACPAC publish.'
          );
          "@

          Write-Host "Schema drift detected."
          Write-Host "Writing DRIFT_DETECTED deployment log..."

          sqlcmd `
            -S "${{ secrets.SQL_SERVER }}" `
            -d "${{ secrets.SQL_DATABASE }}" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -b `
            -Q "$query"

          if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not write DRIFT_DETECTED deployment log."
          }
          else {
              Write-Host "DRIFT_DETECTED deployment log written successfully."
          }


      # ======================================================
      # 9. Stop When Drift Is Detected
      # ======================================================

      - name: Stop because schema drift was detected
        if: steps.drift.outputs.status == 'DRIFT'
        shell: powershell
        run: |
          Write-Error "SCHEMA DRIFT DETECTED."
          Write-Error "Deployment blocked before DACPAC publish."
          exit 1


      # ======================================================
      # 10. Stop When Drift Detection Has Technical Error
      # ======================================================

      - name: Stop because drift detection failed
        if: steps.drift.outputs.status == 'ERROR'
        shell: powershell
        run: |
          Write-Error "Schema drift detection failed because of a technical error."
          Write-Error "Deployment will not continue."
          exit 1


      # ======================================================
      # 11. Continue When Database Is Clean
      # ======================================================

      - name: Continue after clean drift check
        if: steps.drift.outputs.status == 'CLEAN'
        shell: powershell
        run: |
          Write-Host "No schema drift detected."
          Write-Host "Continuing with deployment."


      # ======================================================
      # 12. Generate Deployment Report
      # ======================================================

      - name: Generate deployment report
        shell: powershell
        env:
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $dacpac = "database/project/HealthcareCICD.Database/bin/Debug/HealthcareCICD.Database.dacpac"
          $report = "deploy-report.xml"

          if (-not (Test-Path $dacpac)) {
              Write-Error "DACPAC not found: $dacpac"
              exit 1
          }

          if (Test-Path $report) {
              Remove-Item $report -Force
          }

          Write-Host "Generating deployment report..."

          sqlpackage `
            /Action:DeployReport `
            /SourceFile:"$dacpac" `
            /TargetServerName:"${{ secrets.SQL_SERVER }}" `
            /TargetDatabaseName:"${{ secrets.SQL_DATABASE }}" `
            /TargetUser:"$env:SQL_USERNAME" `
            /TargetPassword:"$env:SQL_PASSWORD" `
            /TargetTrustServerCertificate:True `
            /OutputPath:"$report"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "DeployReport generation failed."
              exit 1
          }

          if (-not (Test-Path $report)) {
              Write-Error "DeployReport was not created."
              exit 1
          }

          Write-Host "Deployment report generated successfully."


      # ======================================================
      # 13. Deploy DACPAC
      # ======================================================

      - name: Deploy DACPAC
        id: deploy
        shell: powershell
        env:
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $dacpac = "database/project/HealthcareCICD.Database/bin/Debug/HealthcareCICD.Database.dacpac"

          if (-not (Test-Path $dacpac)) {
              Write-Error "DACPAC not found: $dacpac"
              exit 1
          }

          Write-Host "Deploying DACPAC..."

          sqlpackage `
            /Action:Publish `
            /SourceFile:"$dacpac" `
            /TargetServerName:"${{ secrets.SQL_SERVER }}" `
            /TargetDatabaseName:"${{ secrets.SQL_DATABASE }}" `
            /TargetUser:"$env:SQL_USERNAME" `
            /TargetPassword:"$env:SQL_PASSWORD" `
            /TargetTrustServerCertificate:True `
            /p:RegisterDataTierApplication=True `
            /p:BlockWhenDriftDetected=False `
            /p:BlockOnPossibleDataLoss=True

          if ($LASTEXITCODE -ne 0) {
              Write-Error "DACPAC deployment failed."
              exit 1
          }

          Write-Host "DACPAC deployment completed successfully."


      # ======================================================
      # 14. Run Database Tests
      # ======================================================

      - name: Run database tests
        shell: powershell
        env:
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $testFile = "tests/database-tests.sql"

          if (-not (Test-Path $testFile)) {
              Write-Error "Database test file not found: $testFile"
              exit 1
          }

          Write-Host "Running database tests..."

          sqlcmd `
            -S "${{ secrets.SQL_SERVER }}" `
            -d "${{ secrets.SQL_DATABASE }}" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -b `
            -i "$testFile"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Database tests failed."
              exit 1
          }

          Write-Host "Database tests passed."


      # ======================================================
      # 15. Log Successful Deployment
      # ======================================================

      - name: Log successful deployment
        if: success()
        shell: powershell
        env:
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $commitSha = "${{ github.sha }}"
          $environment = "Development"

          $query = @"
          INSERT INTO dbo.DeploymentLog
          (
              DeploymentDate,
              CommitSha,
              Environment,
              Status,
              ExecutedBy,
              ErrorMessage
          )
          VALUES
          (
              SYSUTCDATETIME(),
              '$commitSha',
              '$environment',
              'SUCCESS',
              SUSER_SNAME(),
              NULL
          );
          "@

          Write-Host "Writing successful deployment log..."

          sqlcmd `
            -S "${{ secrets.SQL_SERVER }}" `
            -d "${{ secrets.SQL_DATABASE }}" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -b `
            -Q "$query"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to write successful deployment log."
              exit 1
          }

          Write-Host "Successful deployment logged."


      # ======================================================
      # 16. Log Failed Deployment
      #
      # This is for actual deployment/test failures.
      # DRIFT_DETECTED has its own log and is excluded here.
      # ======================================================

      - name: Log failed deployment
        if: failure() && steps.drift.outputs.status != 'DRIFT'
        continue-on-error: true
        shell: powershell
        env:
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          $commitSha = "${{ github.sha }}"
          $environment = "Development"

          $query = @"
          INSERT INTO dbo.DeploymentLog
          (
              DeploymentDate,
              CommitSha,
              Environment,
              Status,
              ExecutedBy,
              ErrorMessage
          )
          VALUES
          (
              SYSUTCDATETIME(),
              '$commitSha',
              '$environment',
              'FAILED',
              SUSER_SNAME(),
              'GitHub Actions deployment or database tests failed. Check workflow logs for details.'
          );
          "@

          Write-Host "Writing failed deployment log..."

          sqlcmd `
            -S "${{ secrets.SQL_SERVER }}" `
            -d "${{ secrets.SQL_DATABASE }}" `
            -U "$env:SQL_USERNAME" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -b `
            -Q "$query"

          if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not write failed deployment log."
          }
          else {
              Write-Host "Failed deployment logged."
          }