name: SQL Server CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build SQL Database Project
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SQL Database Project
        shell: powershell
        run: |
          msbuild `
            "database/project/HealthcareCICD.Database/HealthcareCICD.Database/HealthcareCICD.Database.sqlproj" `
            /p:Configuration=Release `
            /p:Platform="Any CPU"

      - name: Verify DACPAC
        shell: powershell
        run: |
          $dacpac = Get-ChildItem `
            -Path "database/project/HealthcareCICD.Database/HealthcareCICD.Database/bin/Release" `
            -Filter "*.dacpac" `
            -Recurse

          if ($dacpac.Count -eq 0) {
              Write-Error "DACPAC was not generated."
          }

          foreach ($file in $dacpac) {
              Write-Host "DACPAC generated: $($file.FullName)"
          }